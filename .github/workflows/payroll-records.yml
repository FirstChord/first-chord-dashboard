name: Check Approved Payroll Records

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: payroll-records-check
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check up to three approved periods
        env:
          ENDPOINT: https://first-chord-dashbord-production.up.railway.app/api/cron/payroll-records
          SECRET: ${{ secrets.SCHEDULE_REFRESH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET" ]; then
            echo "SCHEDULE_REFRESH_SECRET is missing"
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error --max-time 240 -X POST "$ENDPOINT" \
            -H "x-firstchord-schedule-secret: $SECRET")
          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null
